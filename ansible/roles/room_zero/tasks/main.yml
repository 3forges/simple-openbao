echo "# --- "
echo "OPENBAO_KND_EXTERNAL_IP=[$OPENBAO_KND_EXTERNAL_IP]"
echo "KND_NET_NAME=[${KND_NET_NAME}]"
echo "ROOM_ZERO_CONTAINER_NAME=[${ROOM_ZERO_CONTAINER_NAME}]"
echo "# --- "
