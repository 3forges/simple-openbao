### Create Room Zero Home Folder
### 
- name: "Create Room Zero Home Folder"
  become: true
  ansible.builtin.shell: |
    export DESIRED_ROOM_ZERO_HOME='{{ desired_room_zero_home }}'
    echo " DESIRED_ROOM_ZERO_HOME = [${DESIRED_ROOM_ZERO_HOME}] "
    
    mkdir -p ${DESIRED_ROOM_ZERO_HOME}
    chown -R {{ operator_lx_user_name }}:{{ operator_lx_user_name }} ${DESIRED_ROOM_ZERO_HOME}
    ls -alh ${DESIRED_ROOM_ZERO_HOME}
  register: create_room_zero_home_folder_output
  when: 
    - running_os == "debian12"
- name: "Print stdout of Room Zero Home Folder Creation"
  ansible.builtin.debug:
    var: create_room_zero_home_folder_output
    verbosity: 2
  when: 
    - running_os == "debian12"

##########################################
##########################################
##########################################
### Destroy Room Zero if force recreate
### 
- name: "Destroy Room Zero if force recreate"
  become: true
  ansible.builtin.shell: |
    export DESIRED_ROOM_ZERO_HOME='{{ desired_room_zero_home }}'
    echo " DESIRED_ROOM_ZERO_HOME = [${DESIRED_ROOM_ZERO_HOME}] "
    export DESIRED_DOCKER_COMPOSE_FILE_NAME='{{ desired_docker_compose_file_name }}'
    echo " DESIRED_DOCKER_COMPOSE_FILE_NAME = [${DESIRED_DOCKER_COMPOSE_FILE_NAME}] "
    
    ls -alh ${DESIRED_ROOM_ZERO_HOME}
    cd  ${DESIRED_ROOM_ZERO_HOME}
    ls -alh ${DESIRED_ROOM_ZERO_HOME}/${DESIRED_DOCKER_COMPOSE_FILE_NAME}
    docker-compose -f ${DESIRED_DOCKER_COMPOSE_FILE_NAME} down || true
    cd 
    rm -fr ${DESIRED_ROOM_ZERO_HOME}
    mkdir -p ${DESIRED_ROOM_ZERO_HOME}
    chown -R {{ operator_lx_user_name }}:{{ operator_lx_user_name }} ${DESIRED_ROOM_ZERO_HOME}
    ls -alh ${DESIRED_ROOM_ZERO_HOME}
  register: destroy_room_zero_if_force_recreate_output
  when: 
    - running_os == "debian12"
- name: "Print stdout of Destroy Room Zero if force recreate"
  ansible.builtin.debug:
    var: destroy_room_zero_if_force_recreate_output
    verbosity: 2
  when: 
    - running_os == "debian12"
    - should_force_recreate_room_zero
    # - not not should_force_recreate_room_zero




##########################################
##########################################
##########################################
### Prepare OpenBAO TLS Cert
### 
- name: "Prepare OpenBAO TLS Cert"
  # become: true
  ansible.builtin.shell: |
    export DESIRED_PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    echo " DESIRED_PKI_PREPARATION_HOME = [${DESIRED_PKI_PREPARATION_HOME}] "
    export DESIRED_OPENBAO_FQDN='{{ desired_openbao_fqdn }}'
    echo " DESIRED_OPENBAO_FQDN = [${DESIRED_OPENBAO_FQDN}] "
    
    export DESIRED_OPENBAO_TLS_CERT_PATH='{{ desired_openbao_tls_cert_path }}'
    echo " DESIRED_OPENBAO_TLS_CERT_PATH = [${DESIRED_OPENBAO_TLS_CERT_PATH}] "
    
    export DESIRED_OPENBAO_TLS_CERT_KEY_PATH='{{ desired_openbao_tls_cert_key_path }}'
    echo " DESIRED_OPENBAO_TLS_CERT_KEY_PATH = [${DESIRED_OPENBAO_TLS_CERT_KEY_PATH}] "

    export OPENBAO_CERT_CRT_FILEPATH=$DESIRED_PKI_PREPARATION_HOME/$DESIRED_OPENBAO_FQDN/$DESIRED_OPENBAO_FQDN.tls.crt
    export OPENBAO_CERT_KEY_FILEPATH=$DESIRED_PKI_PREPARATION_HOME/$DESIRED_OPENBAO_FQDN/$DESIRED_OPENBAO_FQDN.tls.key
    
    cp ${OPENBAO_CERT_CRT_FILEPATH} ${DESIRED_OPENBAO_TLS_CERT_PATH}
    cp ${OPENBAO_CERT_KEY_FILEPATH} ${DESIRED_OPENBAO_TLS_CERT_KEY_PATH}    
    ls -alh ${DESIRED_OPENBAO_TLS_CERT_PATH}
    ls -alh ${DESIRED_OPENBAO_TLS_CERT_KEY_PATH}
    ls -alh ${DESIRED_ROOM_ZERO_HOME}
  register: prepare_openbao_tls_cert_output
  when: 
    - running_os == "debian12"
- name: "Print stdout of OpenBAO TLS Cert Preparation"
  ansible.builtin.debug:
    var: prepare_openbao_tls_cert_output
    verbosity: 2
  when: 
    - running_os == "debian12"















##########################################
##########################################
##########################################
### Provision Room Zero
### 
- name: "Provision Room Zero"
  # become: true
  ansible.builtin.shell: |
    export DESIRED_ROOM_ZERO_HOME='{{ desired_room_zero_home }}'
    echo " DESIRED_ROOM_ZERO_HOME = [${DESIRED_ROOM_ZERO_HOME}] "
    export DESIRED_DOCKER_COMPOSE_FILE_NAME='{{ desired_docker_compose_file_name }}'
    echo " DESIRED_DOCKER_COMPOSE_FILE_NAME = [${DESIRED_DOCKER_COMPOSE_FILE_NAME}] "
    export DESIRED_ROOM_ZERO_BIND_ADDR='{{ desired_room_zero_bind_addr }}'
    echo " DESIRED_ROOM_ZERO_BIND_ADDR = [${DESIRED_ROOM_ZERO_BIND_ADDR}] "
    export DESIRED_ROOM_ZERO_NON_ROUTED_IP_ADDR='{{ desired_room_zero_non_routed_ip_addr }}'
    echo " DESIRED_ROOM_ZERO_NON_ROUTED_IP_ADDR = [${DESIRED_ROOM_ZERO_NON_ROUTED_IP_ADDR}] "
    export DESIRED_ROOM_ZERO_CONTAINER_NAME='{{ desired_room_zero_container_name }}'
    echo " DESIRED_ROOM_ZERO_CONTAINER_NAME = [${DESIRED_ROOM_ZERO_CONTAINER_NAME}] "
    export DESIRED_KND_NET_NAME='{{ desired_knd_net_name }}'
    echo " DESIRED_KND_NET_NAME = [${DESIRED_KND_NET_NAME}] "
    export DESIRED_OPENBAO_TLS_CERT_PATH='{{ desired_openbao_tls_cert_path }}'
    echo " DESIRED_OPENBAO_TLS_CERT_PATH = [${DESIRED_OPENBAO_TLS_CERT_PATH}] "
    export DESIRED_OPENBAO_TLS_CERT_KEY_PATH='{{ desired_openbao_tls_cert_key_path }}'
    echo " DESIRED_OPENBAO_TLS_CERT_KEY_PATH = [${DESIRED_OPENBAO_TLS_CERT_KEY_PATH}] "
    export DESIRED_OPENBAO_FQDN='{{ desired_openbao_fqdn }}'
    echo " DESIRED_OPENBAO_FQDN = [${DESIRED_OPENBAO_FQDN}] "
    
    ls -alh ${DESIRED_ROOM_ZERO_HOME}
    cd  ${DESIRED_ROOM_ZERO_HOME}
    ls -alh ${DESIRED_ROOM_ZERO_HOME}/${DESIRED_DOCKER_COMPOSE_FILE_NAME}
    # docker-compose -f ${DESIRED_DOCKER_COMPOSE_FILE_NAME} up -d

    ##################################################
    #### Surgery
    
    cd ${DESIRED_ROOM_ZERO_HOME}
    
    echo "# -------------------- # -------------------- "
    echo "# -------------------- # -------------------- "
    echo "# -------------------- "
    echo "# -------------------- "
    
    # export OPENBAO_KND_EXTERNAL_IP=${DESIRED_ROOM_ZERO_NON_ROUTED_IP_ADDR}
    # ---
    # The Ip Address of the OpenBAO Service will be the External IP of the Nginx Ingress Controller 
    export OPENBAO_KND_EXTERNAL_IP=$(kubectl --context kind-openbao-cluster \
      -n ingress-nginx get services \
      -l app.kubernetes.io/instance=ingress-nginx \
      -l app.kubernetes.io/component=controller \
      --field-selector spec.type=LoadBalancer \
      -o jsonpath="{.items[0].status.loadBalancer.ingress[0].ip}")
    
    echo "OPENBAO_KND_EXTERNAL_IP=[${OPENBAO_KND_EXTERNAL_IP}]"
    
    # ---
    # 
    echo "# -------------------- "
    echo "# --- Env Check : "
    echo "# --- "
    echo "OPENBAO_KND_EXTERNAL_IP=[$OPENBAO_KND_EXTERNAL_IP]"
    echo "DESIRED_KND_NET_NAME=[${DESIRED_KND_NET_NAME}]"
    echo "DESIRED_ROOM_ZERO_CONTAINER_NAME=[${DESIRED_ROOM_ZERO_CONTAINER_NAME}]"
    echo "# --- "
    echo "# -------------------- "
    echo "# -------------------- # -------------------- "
    echo "# -------------------- # -------------------- "
    
    if ! [ -f ${DESIRED_OPENBAO_TLS_CERT_PATH} ]; then
      echo "ERROR - The DESIRED_OPENBAO_TLS_CERT_PATH=[${DESIRED_OPENBAO_TLS_CERT_PATH}] file does not exist, itmust exist"
      exit 23
    fi;
    
    if ! [ -f ${DESIRED_OPENBAO_TLS_CERT_KEY_PATH} ]; then
      echo "ERROR - The DESIRED_OPENBAO_TLS_CERT_KEY_PATH=[${DESIRED_OPENBAO_TLS_CERT_KEY_PATH}] file does not exist, itmust exist"
      exit 23
    fi;
    
    # figlet 'Room Zero'
    
    # the docker-compose of the nginx service we will spin up
    docker-compose -f ./${DESIRED_DOCKER_COMPOSE_FILE_NAME} down || true
    cat <<EOF >./${DESIRED_DOCKER_COMPOSE_FILE_NAME}
    version: '3.7'
    
    services:
      room-zero:
        image: nginx:1.19.2-alpine
        hostname: room-zero
        container_name: ${DESIRED_ROOM_ZERO_CONTAINER_NAME}
        volumes:
          - ./nginx.conf:/etc/nginx/nginx.conf:ro
          - ${DESIRED_OPENBAO_TLS_CERT_PATH}:/etc/nginx/certs/${DESIRED_OPENBAO_FQDN}.cert:ro
          - ${DESIRED_OPENBAO_TLS_CERT_KEY_PATH}:/etc/nginx/certs/${DESIRED_OPENBAO_FQDN}.key:ro
        ports:
          - "${DESIRED_ROOM_ZERO_BIND_ADDR}:80:80"
          - "${DESIRED_ROOM_ZERO_BIND_ADDR}:443:443"
        networks:
          room_zero_net:
            aliases:
              - room-zero.pesto.io
    
    networks:
      room_zero_net:
        driver: bridge
    EOF
    
    #################
    ##### OKAY I WILL TRY THAT FIRST VERSION:
    # I still need to generate the certs, and do all needed to 
    # place them in container image by docker volumes...
    cat <<EOF >./nginx.conf
    user  nginx;
    worker_processes  auto;
    
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    
    events {
        worker_connections  4096;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream; 
    
        log_format  main  'room-zero-pesto - \$remote_addr - \$remote_user [\$time_local] "\$request" '
                          '\$status \$body_bytes_sent "\$http_referer" '
                          '"\$http_user_agent" "\$http_x_forwarded_for"';
    
        access_log  /var/log/nginx/access.log  main;
        sendfile        on;
        keepalive_timeout  65;
    
        # include /etc/nginx/conf.d/*.conf;
        
        upstream openbao {
            ip_hash;
            server $OPENBAO_KND_EXTERNAL_IP:443;
        }
    
        server {
            # listen       80;
            # listen  [::]:80;
            listen       443 ssl;
            listen  [::]:443 ssl;
            # server_name  localhost;
            # --- 
            # ${DESIRED_OPENBAO_FQDN}: I would then add in my [/etc/hosts] an entry to map it to the public IP of my VM
            server_name ${DESIRED_OPENBAO_FQDN};
            ssl_certificate /etc/nginx/certs/${DESIRED_OPENBAO_FQDN}.cert;
            ssl_certificate_key /etc/nginx/certs/${DESIRED_OPENBAO_FQDN}.key;
            # ---
            # Stronger than the default [ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;] see https://docs.nginx.com/nginx/admin-guide/security-controls/terminating-ssl-http/
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers "HIGH:!aNULL:!MD5:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256";
            ssl_prefer_server_ciphers on;
    
            # To allow special characters in headers
            ignore_invalid_headers off;
            # Allow any size file to be uploaded.
            # Set to a value such as 1000m; to restrict file size to a specific value
            client_max_body_size 0;
            # To disable buffering
            proxy_buffering off;
            proxy_request_buffering off;
    
            location / {
                proxy_set_header Host \$http_host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
                proxy_set_header X-NginX-Proxy true;
    
                # This is necessary to pass the correct IP to be hashed
                real_ip_header X-Real-IP;
    
                proxy_connect_timeout 300;
                
                # To support websocket
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection "upgrade";
                
                chunked_transfer_encoding off;
                
                # ---
                #  I will for now assume that 
                #  the connection between nginx 
                #  and the reverse-proxied openbao service 
                #  is NOT secured, and when I want to secure with https encryption that part too, I will use:
                #  > This for MTLS (client TLS cert authentication, nginx authenticate to the reverse proxied server using a client cert) https://docs.nginx.com/nginx/admin-guide/security-controls/securing-http-traffic-upstream/
                #  > Or something lighter: NGINX will just need to trust the TLS cert broadcasted by the reverse-proxied openbao 
                # proxy_pass https://openbao;
                proxy_pass http://openbao;
            }
        }
    }
    EOF
    
    docker-compose -f ${DESIRED_DOCKER_COMPOSE_FILE_NAME} up -d
    
    sleep 3s
    
    figlet 'Connect Room Zero'
    
    docker network connect "${DESIRED_KND_NET_NAME}" "${DESIRED_ROOM_ZERO_CONTAINER_NAME}"

#################################################
  register: provision_room_zero_output
  when: 
    - running_os == "debian12"
- name: "Print stdout of Provision Room Zero"
  ansible.builtin.debug:
    var: provision_room_zero_output
    verbosity: 2
  when: 
    - running_os == "debian12"

