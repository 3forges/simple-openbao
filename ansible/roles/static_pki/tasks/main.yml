

---
##########################################
##########################################
##########################################
### Check role provided params

- name: "Set fact desired PKI Preparation Home location"
  ansible.builtin.set_fact:
    desired_pki_preparation_home: "{{ pki_preparation_home  | default('/etc/.pesto.pki') }}"

- name: "Print fact desired PKI Preparation Home location"
  ansible.builtin.debug:
    var: desired_pki_preparation_home
    verbosity: 2

##########################################
### PKI CA (Certificate Autority)
- name: "Set fact desired  PKI CA - Certificate Autority - FQDN"
  ansible.builtin.set_fact:
    desired_pki_ca_fqdn: "{{ pki_ca_fqdn  | default('openbao.pesto.io') }}"

- name: "Print fact desired  PKI CA - Certificate Autority - FQDN"
  ansible.builtin.debug:
    var: desired_pki_ca_fqdn
    verbosity: 2

- name: "Set fact desired PKI CA - Certificate Autority - Name"
  ansible.builtin.set_fact:
    desired_pki_ca_name: "{{ pki_ca_name  | default('') }}"

- name: "Print fact desired PKI CA - Certificate Autority - Name"
  ansible.builtin.debug:
    var: desired_pki_ca_name
    verbosity: 2

# ---
# 1826 days = 5 years
- name: "Set fact desired PKI CA - Certificate Autority - Certificate validity duration (integer, in days)"
  ansible.builtin.set_fact:
    desired_pki_ca_validity_in_days: "{{ pki_ca_validity_in_days  | default('1826') }}"
- name: "Print fact desired PKI CA - Certificate Autority - Certificate validity duration (integer, in days)"
  ansible.builtin.debug:
    var: desired_pki_ca_validity_in_days
    verbosity: 2

- name: "Set fact desired PKI CA - Certificate Autority - passphrase"
  ansible.builtin.set_fact:
    desired_pki_ca_passphrase: "{{ pki_ca_passphrase  | default('') }}"

- name: "Print fact desired PKI CA - Certificate Autority - passphrase - should NOT be printed in production"
  ansible.builtin.debug:
    var: desired_openbao_fqdn
    verbosity: 2
  # when: 
  #   - not is_production

- name: "Set fact Should the PKI CA - Certificate Autority - Cert be re-generated?"
  ansible.builtin.set_fact:
    should_force_regenerate_ca: "{{ force_regenerate_ca  | default('false') }}"

- name: "Print fact Should the PKI CA - Certificate Autority - Cert be re-generated?"
  ansible.builtin.debug:
    var: should_force_regenerate_ca
    verbosity: 2

##########################################
### Open BAO

- name: "Set fact desired OpenBAO FQDN"
  ansible.builtin.set_fact:
    desired_openbao_fqdn: "{{ openbao_fqdn  | default('openbao.pesto.io') }}"

- name: "Print fact desired OpenBAO FQDN"
  ansible.builtin.debug:
    var: desired_openbao_fqdn
    verbosity: 2

- name: "Set fact desired OpenBAO IP Address 1"
  ansible.builtin.set_fact:
    desired_openbao_ip_address_1: "{{ openbao_ip_address_1  | default('127.0.0.1') }}"

- name: "Print fact desired OpenBAO IP Address 1"
  ansible.builtin.debug:
    var: desired_openbao_ip_address_1
    verbosity: 2

- name: "Set fact desired OpenBAO IP Address 2"
  ansible.builtin.set_fact:
    desired_openbao_ip_address_2: "{{ openbao_ip_address_2  | default('127.0.0.1') }}"

- name: "Print fact desired OpenBAO IP Address 2"
  ansible.builtin.debug:
    var: desired_openbao_ip_address_2
    verbosity: 2

# ---
# 730 days = 2 years
- name: "Set fact desired OpenBAO Certificate validity duration - integer, in days"
  ansible.builtin.set_fact:
    desired_openbao_cert_validity_in_days: "{{ openbao_cert_validity_in_days  | default('365') }}"
- name: "Print fact desired OpenBAO Certificate validity duration (integer, in days)"
  ansible.builtin.debug:
    var: desired_openbao_cert_validity_in_days
    verbosity: 2

- name: "Set fact Should the OpenBAO Cert be re-generated"
  ansible.builtin.set_fact:
    should_force_regenerate_openbao_cert: "{{ force_regenerate_openbao_cert  | default('false') }}"

- name: "Print fact Should the OpenBAO Cert be re-generated?"
  ansible.builtin.debug:
    var: should_force_regenerate_openbao_cert
    verbosity: 2

##########################################
##########################################
##########################################
### Create PKI Preparation Home Folder
### 
- name: "Create PKI Preparation Home Folder"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    echo " PKI_PREPARATION_HOME = [$PKI_PREPARATION_HOME] "
    
    if [ -d $PKI_PREPARATION_HOME ]; then
      echo "The [$PKI_PREPARATION_HOME] folder already exists, and its content is:"
      ls -alh $PKI_PREPARATION_HOME
    else
      echo "The [$PKI_PREPARATION_HOME] folder does not exists, so it will be created"
    fi;
    # if [ -d $PKI_PREPARATION_HOME ]; then
    #   rm -fr $PKI_PREPARATION_HOME
    # fi;
    mkdir -p $PKI_PREPARATION_HOME
    chown -R {{ operator_lx_user_name }}:{{ operator_lx_user_name }}  $PKI_PREPARATION_HOME
    ls -alh $PKI_PREPARATION_HOME
  register: create_pki_preparation_home_folder_output
  when: 
    - running_os == "debian12"
    # - force_regenerate_ca
    # - force_regenerate_openbao_cert
    # # - not not force_regenerate_ca
    # # - not not force_regenerate_openbao_cert
- name: "Set fact stdout of PKI Preparation Home Folder Creation"
  ansible.builtin.set_fact:
    create_pki_preparation_home_folder_stdout: "{{ create_pki_preparation_home_folder_output.stdout }}"
  when: 
    - running_os == "debian12"
- name: "Print stdout of PKI Preparation Home Folder Creation"
  ansible.builtin.debug:
    var: create_pki_preparation_home_folder_stdout
    verbosity: 2
  when: 
    - running_os == "debian12"


##########################################
##########################################
##########################################
### Generate PKI CA Cert And OpenBAO Cert
### 

- name: "Check OpenSSL version"
  become: true
  ansible.builtin.shell: |
    # -
    openssl version
  register: openssl_version_output
  when: 
    - running_os == "debian12"
    # - not is_pki_already_prepared

- name: "Set fact OpenSSL Version"
  ansible.builtin.set_fact:
    openssl_version_stdout: "{{ openssl_version_output.stdout }}"
  when: 
    - running_os == "debian12"
    # - not is_pki_already_prepared
- name: "Print OpenSSL Version"
  ansible.builtin.debug:
    var: openssl_version_stdout
    verbosity: 2
  when: 
    - running_os == "debian12"
    # - not is_pki_already_prepared

##########################################
##########################################
##########################################
### Generate PKI CA Cert
### 

##########################################
### 1./ Delete Existing PKI CA Cert when 
#       the 'force_regenerate_ca' 
#       option is set to True

- name: "Delete Existing PKI CA Cert even if it already exists should_force_regenerate_ca value is {{ should_force_regenerate_ca }}"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    ls -alh $PKI_PREPARATION_HOME
    export PESTO_CA_SERVICE_FQDN='{{ desired_pki_ca_fqdn }}'
    echo "The PKI CA Cert already exists in [$PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/], it won't be re-generated ('set force_regenerate_ca' to 'true' if you want to force re-generating the CA Cert):"
    rm -fr $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    mkdir -p $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt
    
  register: delete_existing_ca_cert_output
  when: 
    - running_os == "debian12"
    - should_force_regenerate_ca
    # - not not should_force_regenerate_ca
- name: "Print Delete Existing PKI CA Cert output"
  ansible.builtin.debug:
    var: delete_existing_ca_cert_output
    verbosity: 2
  when: 
    - running_os == "debian12"
    - should_force_regenerate_ca
    # - not not should_force_regenerate_ca

##########################################
### 2./ Check if CA Cert already exists

- name: "Check if CA Cert already exists"
  become: true
  ansible.builtin.shell: |
    if ! [ -f $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key ]; then
      export PESTO_CA_CERT_ALREADY_EXISTS='false'
    else
      export PESTO_CA_CERT_ALREADY_EXISTS='true'
    fi;
    if ! [ -f $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt ]; then
      export PESTO_CA_CERT_ALREADY_EXISTS='false'
    else
      if [ "$PESTO_CA_CERT_ALREADY_EXISTS" = "false" ]; then
        export PESTO_CA_CERT_ALREADY_EXISTS='false'
      else
        export PESTO_CA_CERT_ALREADY_EXISTS='true'
      fi;
    fi;
    echo "$PESTO_CA_CERT_ALREADY_EXISTS"
    
  register: pki_ca_cert_already_exists_output
  when: 
    - running_os == "debian12"

- name: "Set fact PKI CA Cert already exists"
  ansible.builtin.set_fact:
    pki_ca_cert_already_exists: "{{ pki_ca_cert_already_exists_output.stdout }}"
  when: 
    - running_os == "debian12"
- name: "Print fact PKI CA Cert already exists"
  ansible.builtin.debug:
    var: pki_ca_cert_already_exists
    verbosity: 2
  when: 
    - running_os == "debian12"


##########################################
### 3./ Generate PKI CA Cert (if it does not already exist)

- name: "Generate PKI CA Cert - if it does not already exist"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    ls -alh $PKI_PREPARATION_HOME
    export PESTO_CA_SERVICE_FQDN='{{ desired_pki_ca_fqdn }}'

    echo " PKI_PREPARATION_HOME = [$PKI_PREPARATION_HOME] "
    echo " PESTO_CA_SERVICE_FQDN = [$PESTO_CA_SERVICE_FQDN] "
    echo " PKI CA validity in days = {{ desired_pki_ca_validity_in_days }}"
    # --- <<<>>>
    # Generate the Certificate Authority Private Key
    export PESTO_CA_NAME='{{ desired_pki_ca_name }}'
    echo " PESTO_CA_NAME = [$PESTO_CA_NAME]"
    export PESTO_CA_PASSPHRASE='{{ desired_pki_ca_passphrase }}'
    mkdir -p $PKI_PREPARATION_HOME/$PESTO_CA_NAME
    
    # -
    # AES encrypted private key
    openssl genrsa -passout pass:"$PESTO_CA_PASSPHRASE" -aes256 -out $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key 4096
    
    
    # --- <<<>>>
    # Generate the Certificate Authority TLS Certificate (and itmust be saved to the vault later)
    # 1826 days = 5 years
    # 
    
    # # (not sure yet I should set alt names for CA Cert)
    # # openssl req -x509 -new -nodes -key $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key -passin pass:"$PESTO_CA_PASSPHRASE" -sha256 -days {{ desired_pki_ca_validity_in_days }} -out $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt -subj "/CN=$PESTO_CA_NAME$/C=FR/ST=Chamalieres/L=Chamalieres/O=$PESTO_CA_SERVICE_FQDN" -addext "subjectAltName = DNS:$PESTO_CA_SERVICE_FQDN"
    
    
    # --
    # I do not retrieve the PESTO_CA_PASSPHRASE and 
    # the CA Cert Private Key from the vault: because
    # I am in the process of generating the CA Cert, in
    # order to then, generate a TLS Certificate for the
    # OpenBAO Vault service provisioning: So at this 
    # time, the OpenBAO Vault is not yet available.
    openssl req -x509 -new -nodes -key $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key -passin pass:"$PESTO_CA_PASSPHRASE" -sha256 -days 1826 -out $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt -subj "/CN=$PESTO_CA_NAME$/C=FR/ST=Chamalieres/L=Chamalieres/O=$PESTO_CA_SERVICE_FQDN"
    echo "Generated PKI CA in [$PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/]:"
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt
  register: generate_ca_cert_output
  when: 
    - running_os == "debian12"
    - not pki_ca_cert_already_exists

##########################################
### 3./ If PKI CA Cert already 
###     exists, don't generate it, just
###     output an info message that it does

- name: "Do not Generate PKI CA Cert if it already exists"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    export PESTO_CA_SERVICE_FQDN='{{ desired_pki_ca_fqdn }}'
    echo "The PKI CA Cert already exists in [$PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/], it won't be re-generated ('set force_regenerate_ca' to 'true' if you want to force re-generating the CA Cert):"
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt
    
  register: generate_ca_cert_output
  when: 
    - running_os == "debian12"
    - pki_ca_cert_already_exists
    # - not not pki_ca_cert_already_exists



  
- name: "Set fact stdout of CA Cert Generation"
  ansible.builtin.set_fact:
    generate_ca_cert_stdout: "{{ generate_ca_cert_output.stdout }}"
  when: 
    - running_os == "debian12"
    # - not is_pki_already_prepared
- name: "Print stdout of CA Cert Generation"
  ansible.builtin.debug:
    var: generate_ca_cert_stdout
    verbosity: 2
  when: 
    - running_os == "debian12"
    # - not is_pki_already_prepared

##########################################
##########################################
##########################################
### Generate OpenBAO TLS Cert signed by 
### CA Cert
### 


##########################################
### 1./ Delete Existing OpenBAO TLS Cert 
#       when the 'force_regenerate_openbao_cert' 
#       option is set to True

- name: "Delete Existing OpenBAO TLS Cert even if it already exists should_force_regenerate_openbao_cert value is {{ should_force_regenerate_ca }}"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    ls -alh $PKI_PREPARATION_HOME
    export PESTO_CA_SERVICE_FQDN='{{ desired_pki_ca_fqdn }}'
    echo "The OpenBAO TLS Cert already exists in [$PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/], it won't be re-generated (set 'force_regenerate_openbao_cert' to 'true' if you want to force re-generating the CA Cert):"
    rm -fr $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    mkdir -p $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key
    ls -alh $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt
    
  register: delete_existing_ca_cert_output
  when: 
    - running_os == "debian12"
    - should_force_regenerate_openbao_cert
    # - not not should_force_regenerate_ca
- name: "Print Delete Existing PKI CA Cert output"
  ansible.builtin.debug:
    var: delete_existing_ca_cert_output
    verbosity: 2
  when: 
    - running_os == "debian12"
    - should_force_regenerate_ca
    # - not not should_force_regenerate_ca

##########################################
### 2./ Check if OpenBAO TLS Cert already exists

- name: "Check if OpenBAO TLS Cert already exists - and if it is signed by PKI CA Cert"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    export OPENBAO_SERVICE_FQDN='{{ desired_openbao_fqdn }}'
    
    export OPENBAO_CERT_CRT_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.key
    export OPENBAO_CERT_KEY_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.crt
    export OPENBAO_CERT_CSR_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.csr
    export OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.v3.ext
    if ! [ -f $OPENBAO_CERT_CRT_FILEPATH ]; then
      export PESTO_OPENBAO_CERT_ALREADY_EXISTS='false'
    else
      export PESTO_OPENBAO_CERT_ALREADY_EXISTS='true'
    fi;
    if ! [ -f $OPENBAO_CERT_KEY_FILEPATH ]; then
      export PESTO_OPENBAO_CERT_ALREADY_EXISTS='false'
    else
      if [ "$PESTO_OPENBAO_CERT_ALREADY_EXISTS" = "false" ]; then
        export PESTO_OPENBAO_CERT_ALREADY_EXISTS='false'
      else
        export PESTO_OPENBAO_CERT_ALREADY_EXISTS='true'
      fi;
    fi;
    echo "$PESTO_OPENBAO_CERT_ALREADY_EXISTS"
  register: openbao_tls_cert_already_exists_output
  when: 
    - running_os == "debian12"

- name: "Set fact OpenBAO TLS Cert already exists"
  ansible.builtin.set_fact:
    openbao_tls_cert_already_exists: "{{ openbao_tls_cert_already_exists_output.stdout }}"
  when: 
    - running_os == "debian12"
- name: "Print fact OpenBAO TLS Cert already exists"
  ansible.builtin.debug:
    var: openbao_tls_cert_already_exists
    verbosity: 2
  when: 
    - running_os == "debian12"


##########################################
### 3./ Check if existing OpenBAO TLS Cert
###     is signed by CA Cert Key

- name: "Check if OpenBAO TLS Cert is signed by CA Cert Key"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    export OPENBAO_SERVICE_FQDN='{{ desired_openbao_fqdn }}'
    
    export OPENBAO_CERT_CRT_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.key
    export OPENBAO_CERT_KEY_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.crt
    export OPENBAO_CERT_CSR_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.csr
    export OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.v3.ext

    # ---
    # Let's verify the OpenBAO generated TLS Cert, with the 
    # CA Cert
    export PESTO_CA_SERVICE_FQDN='{{ desired_pki_ca_fqdn }}'
    
  register: openbao_tls_cert_is_signed_by_ca_output
  when: 
    - running_os == "debian12"
    - openbao_tls_cert_already_exists
    # - not not openbao_tls_cert_already_exists

- name: "Set fact OpenBAO TLS Cert is signed by CA Cert Key"
  ansible.builtin.set_fact:
    openbao_tls_cert_is_signed_by_ca: "{{ openbao_tls_cert_is_signed_by_ca_output.stdout }}"
  when: 
    - running_os == "debian12"
    - openbao_tls_cert_already_exists
    # - not not openbao_tls_cert_already_exists
- name: "Print fact OpenBAO TLS Cert is signed by CA Cert Key"
  ansible.builtin.debug:
    var: openbao_tls_cert_is_signed_by_ca
    verbosity: 2
  when: 
    - running_os == "debian12"
    - openbao_tls_cert_already_exists
    # - not not openbao_tls_cert_already_exists

##########################################
### 4./ Generate OpenBAO TLS Cert signed 
###     by CA Cert (if it does not 
###     already exist)

- name: "Generate OpenBAO TLS Cert signed by CA Cert"
  become: true
  ansible.builtin.shell: |
    # -
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    ls -alh $PKI_PREPARATION_HOME

    export OPENBAO_SERVICE_FQDN='{{ desired_openbao_fqdn }}'
    
    export OPENBAO_CERT_CRT_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.key
    export OPENBAO_CERT_KEY_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.crt
    export OPENBAO_CERT_CSR_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.csr
    export OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.v3.ext
    
    echo " PKI_PREPARATION_HOME = [$PKI_PREPARATION_HOME] "
    echo " OPENBAO_SERVICE_FQDN = [$OPENBAO_SERVICE_FQDN] "
    echo " OPENBAO_CERT_CRT_FILEPATH = [$OPENBAO_CERT_CRT_FILEPATH] "
    echo " OPENBAO_CERT_KEY_FILEPATH = [$OPENBAO_CERT_KEY_FILEPATH] "
    echo " OPENBAO_CERT_CSR_FILEPATH = [$OPENBAO_CERT_CSR_FILEPATH] "
    echo " OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH = [$OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH] "
    echo " desired_openbao_cert_validity_in_days = [{{ desired_openbao_cert_validity_in_days }}]"

    # 1./ Generate the TLS Certificate Signing Request for OpenBAO
    openssl req -new -nodes -out $OPENBAO_CERT_CSR_FILEPATH -newkey rsa:4096 -keyout $OPENBAO_CERT_CRT_FILEPATH -subj "/CN=$OPENBAO_SERVICE_FQDN/C=FR/ST=Chamalieres/L=Chamalieres/O=$OPENBAO_SERVICE_FQDN"
    
    # 2./ Generate the v3 ext file for SAN properties for OpenBAO
    export OPENBAO_SERVICE_IP_ADDR_1='{{ desired_openbao_ip_address_1 }}'
    export OPENBAO_SERVICE_IP_ADDR_2='{{ desired_openbao_ip_address_2 }}'
    echo " OPENBAO_SERVICE_IP_ADDR_1=[$OPENBAO_SERVICE_IP_ADDR_1] "
    echo " OPENBAO_SERVICE_IP_ADDR_2=[$OPENBAO_SERVICE_IP_ADDR_2] "
    
    cat > $OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH << EOF
    authorityKeyIdentifier=keyid,issuer
    basicConstraints=CA:FALSE
    keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
    subjectAltName = @alt_names
    [alt_names]
    DNS.1 = $OPENBAO_SERVICE_FQDN
    DNS.2 = openbao.local
    IP.1 = $OPENBAO_SERVICE_IP_ADDR_1
    IP.2 = $OPENBAO_SERVICE_IP_ADDR_2
    EOF
    
    # 3./ Generate the OpenBAO TLS Cert, signed with the CA Cert Key (no private key is generated, since it was already generated at CSR time generation):
    
    openssl x509 -req -passin pass:"$PESTO_CA_PASSPHRASE" -in $OPENBAO_CERT_CSR_FILEPATH -CA $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt -CAkey $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.key -CAcreateserial -out $OPENBAO_CERT_KEY_FILEPATH -days {{ desired_openbao_cert_validity_in_days }} -sha256 -extfile $OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH
    
    # files generated are:
    
    ls -alh $OPENBAO_CERT_CRT_FILEPATH
    ls -alh $OPENBAO_CERT_KEY_FILEPATH
    ls -alh $OPENBAO_CERT_CSR_FILEPATH
    ls -alh $OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH
    
    # ---
    # FINALLY let's verify the OpenBAO generated TLS Cert, with the 
    # CA Cert
    export PESTO_CA_SERVICE_FQDN='{{ desired_pki_ca_fqdn }}'
    openssl verify -verbose -CAfile $PKI_PREPARATION_HOME/$PESTO_CA_SERVICE_FQDN/$PESTO_CA_SERVICE_FQDN.crt $OPENBAO_CERT_KEY_FILEPATH
  register: generate_openbao_cert_output
  when: 
    - running_os == "debian12"
    - not openbao_tls_cert_already_exists

- name: "Set fact stdout of OpenBAO TLS Cert Generation"
  ansible.builtin.set_fact:
    generate_openbao_cert_stdout: "{{ generate_openbao_cert_output.stdout }}"
  when: 
    - running_os == "debian12"
    # - not is_pki_already_prepared
- name: "Print stdout of OpenBAO TLS Cert Generation"
  ansible.builtin.debug:
    var: generate_openbao_cert_stdout
    verbosity: 2
  when: 
    - running_os == "debian12"
    - not openbao_tls_cert_already_exists




##########################################
##########################################
##########################################
### Generate Helper to Trust CA
### 


- name: "Generate Helper to Trust CA"
  become: true
  ansible.builtin.shell: |
    export PKI_PREPARATION_HOME='{{ desired_pki_preparation_home }}'
    ls -alh $PKI_PREPARATION_HOME

    export PESTO_CA_SERVICE_FQDN='{{ desired_pki_ca_fqdn }}'
    export OPENBAO_SERVICE_FQDN='{{ desired_openbao_fqdn }}'
    
    export OPENBAO_CERT_CRT_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.key
    export OPENBAO_CERT_KEY_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.tls.crt
    export OPENBAO_CERT_CSR_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.csr
    export OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH=$PKI_PREPARATION_HOME/$OPENBAO_SERVICE_FQDN/$OPENBAO_SERVICE_FQDN.v3.ext
    
    echo " PKI_PREPARATION_HOME = [$PKI_PREPARATION_HOME] "
    echo " OPENBAO_SERVICE_FQDN = [$OPENBAO_SERVICE_FQDN] "
    echo " OPENBAO_CERT_CRT_FILEPATH = [$OPENBAO_CERT_CRT_FILEPATH] "
    echo " OPENBAO_CERT_KEY_FILEPATH = [$OPENBAO_CERT_KEY_FILEPATH] "
    echo " OPENBAO_CERT_CSR_FILEPATH = [$OPENBAO_CERT_CSR_FILEPATH] "
    echo " OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH = [$OPENBAO_CERT_CSR_V3_SAN_PROPS_FILEPATH] "
    echo " PESTO_CA_SERVICE_FQDN = [$PESTO_CA_SERVICE_FQDN] "
    
    ######################################
    ## Generate helper to trust the CA on 
    ## any GNU/Linux machine

    cat <<EOF >$PKI_PREPARATION_HOME/trusting.ca.sh
    setUpVaultBAOAlias () {
    # ---
    # requires to sudo
    export BAO_CLI_EXECUTABLE_LOCATION=$(which bao)
    sudo ln -s $BAO_CLI_EXECUTABLE_LOCATION /usr/bin/vault
    vault --version
    
    }
    # <<<<<<<<<<<<<<<<<>>>>>>>>>>>>>>>>>
    # >>> To trust The CA signed certifcates in an OS:
    # 
    
    trustCAforDebianDerivedDistribs() {
    
    export VAULT_ADDR="https://$OPENBAO_SERVICE_FQDN"
    export BAO_ADDR="$VAULT_ADDR"
    # ---
    # https://openbao.org/docs/auth/jwt/oidc-providers/keycloak/
    vault login -method=oidc -path=keycloak role=pesto-default
    
    export PESTO_CA_CERT_BASE64_ENCODED=$(vault kv get -field=ca-crt -mount=apps/pesto/kv/nonprod /pesto/pki/ca-cert)
    echo "$PESTO_CA_KEY_BASE64_ENCODED" | base64 -d | tee ./pestoplatform.ca.crt
    
    sudo apt-get install -y ca-certificates
    sudo cp ./pestoplatform.ca.crt /usr/local/share/ca-certificates
    sudo update-ca-certificates
    }
    
    trustCAforRedhatDistribs() {
    
    export VAULT_ADDR="https://$OPENBAO_SERVICE_FQDN"
    export BAO_ADDR="$VAULT_ADDR"
    # ---
    # https://openbao.org/docs/auth/jwt/oidc-providers/keycloak/
    vault login -method=oidc -path=keycloak role=pesto-default
    
    export PESTO_CA_CERT_BASE64_ENCODED=$(vault kv get -field=ca-crt -mount=apps/pesto/kv/nonprod /pesto/pki/ca-cert)
    echo "$PESTO_CA_KEY_BASE64_ENCODED" | base64 -d | tee ./pestoplatform.ca.crt
    
    sudo cp ./pestoplatform.ca.crt /etc/pki/ca-trust/source/anchors/pestoplatform.ca.crt
    sudo update-ca-trust
    }
    EOF

  register: generate_openbao_cert_output
  when: 
    - running_os == "debian12"