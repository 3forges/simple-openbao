---
- name: Provision OpenBAO
  hosts: [k8s-cluster]
  any_errors_fatal: true
  gather_facts: false
  roles:
    # ---
    # (Re-)Install Arkade
    - role: arkade
      force_reinstall_arkade: true
      arkade_version: '0.11.38'
      arkade_os: 'linux'
      arkade_cpu_arch: 'amd64'
    # ---
    # PKI
    - role: static_pki
      # ---
      pki_preparation_home: "{{ pesto_pki_preparation_home }}"
      # ---
      pki_ca_fqdn: "{{ pesto_pki_ca_fqdn }}"
      pki_ca_name: "{{ pesto_pki_ca_name }}"
      pki_ca_validity_in_days: "{{ pesto_pki_ca_validity_in_days }}"
      pki_ca_passphrase: "{{ pesto_pki_ca_passphrase }}"
      force_regenerate_ca: true
      # ---
      openbao_fqdn: "{{ pesto_openbao_fqdn }}"
      openbao_ip_address_1: "{{ pesto_openbao_ip_address_1 }}"
      openbao_ip_address_2: "{{ pesto_openbao_ip_address_2 }}"
      openbao_cert_validity_in_days: "{{ pesto_openbao_cert_validity_in_days }}"
      force_regenerate_openbao_cert: true

    # ---
    # ROOM-ZERO
    - role: room_zero
      force_recreate: "{{ force_recreate_room_zero }}"
      room_zero_home: "{{ pesto_room_zero_home }}"
      room_zero_bind_addr: "{{ pesto_room_zero_bind_addr }}"
      room_zero_non_routed_ip_addr: "{{ pesto_room_zero_non_routed_ip_addr }}"
      knd_net_name: "{{ pesto_knd_net_name }}"
      openbao_fqdn: "{{ pesto_openbao_fqdn }}"
      room_zero_container_name: "{{ pesto_room_zero_container_name }}"
      openbao_tls_cert_path: "{{ pesto_openbao_tls_cert_path }}"
      openbao_tls_cert_key_path: "{{ pesto_openbao_tls_cert_key_path }}"
      # room_zero_docker_compose_file_name: "{{ pesto_room_zero_docker_compose_file_name }}"


